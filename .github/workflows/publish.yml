name: publish
on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: dry-run
        options: [dry-run, publish]
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
  rehearsal:
    needs: verify
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'publish') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TESTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: .phase-loop/guard/download
          merge-multiple: true
      - name: Verify producer binding
        run: |
          test "$TESTED_SOURCE_SHA" = "${{ needs.verify.outputs.tested_source_sha }}"
          node scripts/verify-publish-artifacts.mjs .phase-loop/guard/download/manifest.json "${{ needs.verify.outputs.artifact_manifest_sha256 }}"
      - name: Rehearse retained packages in dependency order
        env:
          NPM_PUBLISH_DRY_RUN: '1'
        run: |
          bash scripts/publish-package-if-needed.sh --verified-artifact .phase-loop/guard/download/manifest.json @consiliency/runtime-provider --expected-manifest-sha256 "${{ needs.verify.outputs.artifact_manifest_sha256 }}"
          bash scripts/publish-package-if-needed.sh --verified-artifact .phase-loop/guard/download/manifest.json @consiliency/pipeline-provider-adapter --expected-manifest-sha256 "${{ needs.verify.outputs.artifact_manifest_sha256 }}"
          bash scripts/publish-package-if-needed.sh --verified-artifact .phase-loop/guard/download/manifest.json @consiliency/omnigent-transport --expected-manifest-sha256 "${{ needs.verify.outputs.artifact_manifest_sha256 }}"
  publish-npm:
    needs: verify
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TESTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: .phase-loop/guard/download
          merge-multiple: true
      - name: Verify producer binding
        run: |
          test "$TESTED_SOURCE_SHA" = "${{ needs.verify.outputs.tested_source_sha }}"
          node scripts/verify-publish-artifacts.mjs .phase-loop/guard/download/manifest.json "${{ needs.verify.outputs.artifact_manifest_sha256 }}"
      - name: Publish retained packages in dependency order
        run: |
          bash scripts/publish-package-if-needed.sh --verified-artifact .phase-loop/guard/download/manifest.json @consiliency/runtime-provider --expected-manifest-sha256 "${{ needs.verify.outputs.artifact_manifest_sha256 }}"
          bash scripts/publish-package-if-needed.sh --verified-artifact .phase-loop/guard/download/manifest.json @consiliency/pipeline-provider-adapter --expected-manifest-sha256 "${{ needs.verify.outputs.artifact_manifest_sha256 }}"
          bash scripts/publish-package-if-needed.sh --verified-artifact .phase-loop/guard/download/manifest.json @consiliency/omnigent-transport --expected-manifest-sha256 "${{ needs.verify.outputs.artifact_manifest_sha256 }}"
